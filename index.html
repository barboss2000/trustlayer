<!DOCTYPE html>
<html>
<head>
  <title>TrustLayer OP_NET Checker</title>
</head>
<body style="background:#0b0f1a;color:white;font-family:sans-serif;padding:40px">

<h2>OP_NET Balance Checker</h2>

<input id="address" placeholder="Enter OP_NET address"
       style="width:400px;padding:10px" />

<button onclick="checkBalance()"
        style="padding:10px 20px;margin-left:10px">
  Check
</button>

<pre id="result" style="margin-top:20px"></pre>

<script>
async function checkBalance() {
  const address = document.getElementById("address").value.trim()
  const resultEl = document.getElementById("result")

  if (!address) {
    resultEl.innerText = "Enter address"
    return
  }

  resultEl.innerText = "Loading..."

  try {
    const response = await fetch("https://regtest.opnet.org/api/v1/json-rpc", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        jsonrpc: "2.0",
        method: "getBalance",
        params: [address],
        id: 1
      })
    })

    const data = await response.json()

    resultEl.innerText = JSON.stringify(data, null, 2)

  } catch (err) {
    resultEl.innerText = "Error: " + err.message
  }
}
</script>

</body>
</html>
