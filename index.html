<!DOCTYPE html>
<html>
<head>
  <title>TrustLayer OP_NET Checker</title>
</head>
<body style="background:#0b0f1a;color:white;font-family:sans-serif;padding:40px">

<h2>OP_NET Balance Checker</h2>

<input id="address"
       placeholder="Enter OP_NET address"
       style="width:400px;padding:10px" />

<button id="checkBtn"
        style="padding:10px 20px;margin-left:10px">
  Check
</button>

<pre id="result" style="margin-top:20px"></pre>

<script type="module">
import { JSONRpcProvider, OP_NET } from "https://esm.sh/opnet"

const provider = new JSONRpcProvider(
  "https://regtest.opnet.org",
  OP_NET.Testnet
)

async function checkBalance() {
  const address = document.getElementById("address").value.trim()
  const resultEl = document.getElementById("result")

  if (!address) {
    resultEl.innerText = "Enter address"
    return
  }

  resultEl.innerText = "Loading..."

  try {
    const balance = await provider.getBalance(address)

    resultEl.innerText = JSON.stringify({
      network: "OP_NET Testnet",
      address,
      balance
    }, null, 2)

  } catch (err) {
    resultEl.innerText = "Error: " + err.message
  }
}

document
  .getElementById("checkBtn")
  .addEventListener("click", checkBalance)

</script>

</body>
</html>
